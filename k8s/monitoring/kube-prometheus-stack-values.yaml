# Lean install for a single 15 GiB WSL2 node that also runs vLLM.
alertmanager:
  enabled: false
grafana:
  # admin password is generated by the chart: see the Makefile/README for how to read it.
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      searchNamespace: ALL
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 384Mi}
prometheus:
  prometheusSpec:
    retention: 3d
    # Pick up ServiceMonitors from any namespace, not only those labelled for this release.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    resources:
      requests: {cpu: 200m, memory: 512Mi}
      limits: {memory: 1536Mi}
prometheusOperator:
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {memory: 256Mi}
kube-state-metrics:
  resources:
    requests: {cpu: 20m, memory: 32Mi}
    limits: {memory: 128Mi}
# k3s runs these inside one process and does not expose them as the chart expects.
kubeEtcd: {enabled: false}
kubeScheduler: {enabled: false}
kubeControllerManager: {enabled: false}
kubeProxy: {enabled: false}
# node-exporter image (quay.io) failed to pull on this node and host-level metrics are out of scope.
nodeExporter:
  enabled: false
prometheus-node-exporter:
  enabled: false
