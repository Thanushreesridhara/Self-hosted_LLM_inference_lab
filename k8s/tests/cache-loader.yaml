# Temporary pod that mounts the model cache PVC so weights can be copied in.
apiVersion: v1
kind: Pod
metadata:
  name: cache-loader
  namespace: llm-inference
spec:
  restartPolicy: Never
  containers:
    - name: loader
      image: vllm/vllm-openai@sha256:befccf0e7e4089aa23926bb6f887a85c0d46c2a99e6de5c5ffdf5cb7957c5b34
      command: ["sleep", "3600"]
      resources:
        requests: {cpu: 100m, memory: 128Mi}
        limits: {memory: 1Gi}
      volumeMounts:
        - name: hf-cache
          mountPath: /cache
  volumes:
    - name: hf-cache
      persistentVolumeClaim:
        claimName: hf-cache
